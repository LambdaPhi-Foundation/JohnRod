[package]
name = "jonrod"
version = "1.0.0"
edition = "2021"
authors = ["JohnRod Contributors"]
description = "A high-performance JohnRod language interpreter in Rust"

[dependencies]
rustc-hash = "2.0"
indexmap = "2.6"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
